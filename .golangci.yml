version: "2"

run:
  build-tags:
    - integration
    - test

linters:
  default: none
  enable:
    # Correctness
    - govet          # copylocks (mutex copy), shadow, printf, composite literal
    - staticcheck    # SA2xxx sync misuse, SA4xxx dead code, and broader quality
    - errorlint      # errors formatted with %v instead of %w in fmt.Errorf
    - nilerr         # returning nil error when a non-nil error was just checked
    - nilnesserr
    - forcetypeassert # unchecked type assertions that can panic
    - durationcheck  # two time.Duration values multiplied together (almost always a bug)
    - gocritic
    - makezero

    # Hygiene
    - bodyclose      # unclosed HTTP response bodies
    - noctx          # HTTP/exec calls missing context propagation
    - ineffassign    # assigned value never used (can mask dropped errors)
    - misspell       # common English misspellings in identifiers and comments
    - gosec
    - contextcheck
    - errcheck
    - nolintlint

  settings:
    gocritic:
      disable-all: true
      # Check descriptions: https://go-critic.com/overview.html
      enabled-checks:
        - appendAssign
        - argOrder
        - badCall
        - badCond
        - badSorting
        - badSyncOnceFunc
        - caseOrder
        - deferInLoop
        - dupArg
        - dupBranchBody
        - dupCase
        - dupSubExpr
        - exitAfterDefer
        - externalErrorReassign
        - offBy1
        - rangeAppendAll
        - returnAfterHttpError
        - sloppyLen
        - sortSlice
        - truncateCmp
        - uncheckedInlineErr
        - weakCond
    errcheck:
      check-blank: true
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    gosec:
      # Rule descriptions: https://github.com/securego/gosec/blob/v2.29.0/RULES.md#rules-list
      includes:
        - G106
        - G110
        - G112
        - G114
        - G401
        - G402
        - G403
        - G405
        - G406
        - G407
        - G501
        - G502
        - G503
        - G504
        - G505

  exclusions:
    rules:
      # Test code intentionally uses simplified HTTP/exec APIs and unsafe assertions.
      - path: _test\.go
        linters: [noctx, bodyclose, forcetypeassert, contextcheck]
      # CLI and daemon entry points have no ambient request context by design.
      - path: ^cmd/
        linters: [noctx]
      - path: ^internal/(daemon|auth)/
        linters: [noctx]
      - path: _test\.go$
        linters: [gosec, errcheck, nolintlint]
      - path: ^(internal/testutil|internal/auth/authtest|internal/config/configtest|test/fakemcp|cmd/echomcp)/
        linters: [gosec, errcheck, nolintlint]
      - path: ^internal/(clock|transport)/fake\.go$
        linters: [gosec, errcheck, nolintlint]

formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/mcpmini/mini
    golines:
      max-len: 120
      shorten-comments: false
      reformat-tags: false
