<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Heading}} · mini</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='8' fill='{{if .OK}}%2316a34a{{else}}%23dc2626{{end}}'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --text: #1c1f24;
  --muted: #5c6370;
  --border: #e3e6eb;
  --ok: #16a34a;
  --ok-soft: #dcfce7;
  --fail: #dc2626;
  --fail-soft: #fee2e2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317;
    --card: #1a1d23;
    --text: #e8eaee;
    --muted: #9aa1ad;
    --border: #2a2e36;
    --ok: #4ade80;
    --ok-soft: #14301f;
    --fail: #f87171;
    --fail-soft: #3a1a1a;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main {
  width: 100%;
  max-width: 420px;
  padding: 40px 32px 32px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 24px rgba(0, 0, 0, .06);
  text-align: center;
  animation: rise .35s ease-out both;
}
.icon {
  display: inline-flex;
  width: 56px;
  height: 56px;
  margin-bottom: 20px;
  border-radius: 50%;
  align-items: center;
  justify-content: center;
  background: var(--ok-soft);
  color: var(--ok);
}
.fail .icon { background: var(--fail-soft); color: var(--fail); }
.icon svg { width: 28px; height: 28px; }
h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
p { margin: 0; color: var(--muted); }
.detail {
  margin: 20px 0 0;
  padding: 12px 14px;
  border-radius: 10px;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  text-align: left;
  overflow-wrap: anywhere;
}
footer { margin-top: 28px; color: var(--muted); font-size: 13px; letter-spacing: .02em; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
</head>
<body>
<main{{if not .OK}} class="fail"{{end}}>
  <div class="icon" aria-hidden="true">
    {{- if .OK}}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    {{- else}}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>
    {{- end}}
  </div>
  <h1>{{.Heading}}</h1>
  <p>{{.Hint}}</p>
  {{- with .Detail}}
  <p class="detail">{{.}}</p>
  {{- end}}
  <footer>mini</footer>
</main>
</body>
</html>
