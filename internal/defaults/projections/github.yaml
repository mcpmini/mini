# Philosophy: docs/default-config-philosophy.md
list_pull_requests:
  string_limits:
    body: 1500

list_issues:
  string_limits:
    body: 1500

issue_read:
  exclude: [user.avatar_url]
  string_limits:
    body: 8000

pull_request_read:
  exclude: [user.avatar_url]
  string_limits:
    body: 8000

get_commit:
  string_limits:
    message: 2000
    patch: 3000
  array_limits:
    files: 50

list_commits:
  array_limits:
    default: 30
  string_limits:
    message: 500

search_code:
  array_limits:
    items: 20
    text_matches: 3
  string_limits:
    fragment: 500

search_repositories:
  array_limits:
    items: 15
    topics: 10
  string_limits:
    description: 400

search_issues:
  array_limits:
    items: 20
    labels: 5
  string_limits:
    body: 500
