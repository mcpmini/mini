# Philosophy: docs/default-config-philosophy.md
list_pull_requests:
  string_limits:
    body: 1500

list_issues:
  string_limits:
    body: 1500

issue_read:
  exclude: [user.avatar_url]
  string_limits:
    body: 8000

pull_request_read:
  exclude: [user.avatar_url]
  string_limits:
    body: 8000

get_commit:
  string_limits:
    message: 2000
    patch: 3000

list_commits:
  string_limits:
    message: 500

search_code:
  string_limits:
    fragment: 500

search_repositories:
  string_limits:
    description: 400

search_issues:
  string_limits:
    body: 500
