# Philosophy: docs/default-config-philosophy.md
# Paths target legacy REST shapes; on modern (2026-07-28) results they match nothing.

search_issues: &search_issues
  exclude:
    - "items[].user.following_url"
    - "items[].user.starred_url"
    - "items[].user.gists_url"
    - "items[].user.events_url"
    - "items[].assignee.following_url"
    - "items[].assignee.starred_url"
    - "items[].assignee.gists_url"
    - "items[].assignee.events_url"
    - "items[].assignees[].following_url"
    - "items[].assignees[].starred_url"
    - "items[].assignees[].gists_url"
    - "items[].assignees[].events_url"
    - "items[].milestone.creator.following_url"
    - "items[].milestone.creator.starred_url"
    - "items[].milestone.creator.gists_url"
    - "items[].milestone.creator.events_url"
    - "items[].closed_by.following_url"
    - "items[].closed_by.starred_url"
    - "items[].closed_by.gists_url"
    - "items[].closed_by.events_url"
    - "items[].labels_url"
    - "items[].user.node_id"
    - "items[].assignee.node_id"
    - "items[].assignees[].node_id"
    - "items[].milestone.creator.node_id"
    - "items[].closed_by.node_id"
    - "items[].node_id"
    - "items[].labels[].node_id"
    - "items[].milestone.node_id"
    - "items[].user.gravatar_id"
    - "items[].user.site_admin"
    - "items[].user.user_view_type"
    - "items[].assignee.gravatar_id"
    - "items[].assignee.site_admin"
    - "items[].assignee.user_view_type"
    - "items[].assignees[].gravatar_id"
    - "items[].assignees[].site_admin"
    - "items[].assignees[].user_view_type"
    - "items[].milestone.creator.gravatar_id"
    - "items[].milestone.creator.site_admin"
    - "items[].milestone.creator.user_view_type"
    - "items[].closed_by.gravatar_id"
    - "items[].closed_by.site_admin"
    - "items[].closed_by.user_view_type"
    - "items[].labels[].color"
    - "items[].labels[].default"
    - "items[].user.avatar_url"
    - "items[].assignee.avatar_url"
    - "items[].assignees[].avatar_url"
    - "items[].milestone.creator.avatar_url"
    - "items[].closed_by.avatar_url"

search_pull_requests: *search_issues

search_repositories:
  exclude:
    - "items[].archive_url"
    - "items[].assignees_url"
    - "items[].blobs_url"
    - "items[].branches_url"
    - "items[].collaborators_url"
    - "items[].comments_url"
    - "items[].commits_url"
    - "items[].compare_url"
    - "items[].contents_url"
    - "items[].git_commits_url"
    - "items[].git_refs_url"
    - "items[].git_tags_url"
    - "items[].issue_comment_url"
    - "items[].issue_events_url"
    - "items[].issues_url"
    - "items[].keys_url"
    - "items[].labels_url"
    - "items[].milestones_url"
    - "items[].notifications_url"
    - "items[].pulls_url"
    - "items[].releases_url"
    - "items[].statuses_url"
    - "items[].trees_url"
    - "items[].node_id"
    - "items[].owner.events_url"
    - "items[].owner.following_url"
    - "items[].owner.gists_url"
    - "items[].owner.starred_url"
    - "items[].owner.node_id"
    - "items[].owner.gravatar_id"
    - "items[].owner.site_admin"
    - "items[].owner.user_view_type"
    - "items[].owner.avatar_url"

list_pull_requests:
  exclude:
    - "[].user.avatar_url"

issue_read:
  string_limits:
    body: 25000
  exclude:
    - "user.avatar_url"
    - "[].user.avatar_url"

pull_request_read:
  string_limits:
    body: 25000
    patch: 5000
  exclude:
    - "user.avatar_url"
    - "[].user.avatar_url"

list_commits:
  exclude:
    - "[].author.avatar_url"
    - "[].committer.avatar_url"

get_commit:
  string_limits:
    message: 25000
    patch: 5000
  exclude:
    - "author.avatar_url"
    - "committer.avatar_url"

get_file_contents:
  string_limits:
    text: 25000
