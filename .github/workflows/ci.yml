name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.claude/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Repo convention checks
        run: |
          go run ./tools/funclen .
          go run ./tools/params .
          go run ./tools/returns .
          go run ./tools/clocklint .
          go run ./tools/testkind .
          GOFLAGS="${GOFLAGS:-} -tags=integration,test" go run ./tools/structlint ./...

      - name: Vet
        # go vet ./... doesn't run against all tags by default
        # specifying the tags here runs it over all the prod code AND the tests
        run: go vet -tags integration,test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      - name: Vulnerability check
        run: ./scripts/check-vulnerabilities.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Build test helpers
        run: |
          testbin=$(mktemp -d)
          go build -o "$testbin/echomcp" ./cmd/echomcp
          echo "ECHOMCP_BIN=$testbin/echomcp" >> "$GITHUB_ENV"

      - name: Unit tests
        run: go test -race -tags test -timeout 120s ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Build test helpers
        run: |
          testbin=$(mktemp -d)
          go build -o "$testbin/echomcp" ./cmd/echomcp
          echo "ECHOMCP_BIN=$testbin/echomcp" >> "$GITHUB_ENV"

      - name: Integration tests
        run: go test -race -tags integration,test -run '^TestIntegration' -timeout 180s ./...

  ci:
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.unit.result }}" != "success" || "${{ needs.integration.result }}" != "success" ]]; then
            exit 1
          fi
