name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.claude/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Repo convention checks
        run: |
          go run ./tools/funclen .
          go run ./tools/params .
          go run ./tools/returns .
          go run ./tools/clocklint .
          go run ./tools/testkind .
          GOFLAGS="${GOFLAGS:-} -tags=integration,test" go run ./tools/structlint ./...

      - name: Vet
        # go vet ./... doesn't run against all tags by default
        # specifying the tags here runs it over all the prod code AND the tests
        run: go vet -tags integration,test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.14.0

      - name: Vulnerability check
        run: ./scripts/check-vulnerabilities.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Build test helpers
        run: |
          testbin=$(mktemp -d)
          scripts/test-bins.sh "$testbin" >> "$GITHUB_ENV"

      - name: Unit tests
        run: go test -race -tags test -timeout 120s ./...

  integration:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # Each test name must match exactly one shard. The rest shard is the catch-all for
      # tests that no named shard selects, so new tests run without a workflow edit.
      matrix:
        shard:
          - name: cli
            run: '^TestIntegrationCLI'
            skip: '^$'
          - name: daemon
            run: '^TestIntegrationDaemon'
            skip: '^$'
          - name: proxy-http
            run: '^TestIntegration(Proxy|Startup|Serve|Server|HTTP|Concurrency)'
            skip: '^$'
          - name: rest
            run: '^TestIntegration'
            skip: '^TestIntegration(CLI|Daemon|Proxy|Startup|Serve|Server|HTTP|Concurrency)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build test helpers
        run: |
          testbin=$(mktemp -d)
          scripts/test-bins.sh "$testbin" >> "$GITHUB_ENV"

      - name: Integration tests (${{ matrix.shard.name }})
        run: go test -race -tags integration,test -run "${{ matrix.shard.run }}" -skip "${{ matrix.shard.skip }}" -timeout 180s ./...

  ci:
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.unit.result }}" != "success" || "${{ needs.integration.result }}" != "success" ]]; then
            exit 1
          fi
