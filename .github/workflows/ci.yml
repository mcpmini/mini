name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.claude/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Repo convention checks
        run: |
          go run ./tools/funclen .
          go run ./tools/params .
          go run ./tools/returns .
          go run ./tools/clocklint .
          go run ./tools/testkind .
          GOFLAGS="${GOFLAGS:-} -tags=integration,test" go run ./tools/structlint ./...

      - name: Vet
        # go vet ./... doesn't run against all tags by default
        # specifying the tags here runs it over all the prod code AND the tests
        run: go vet -tags integration,test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Vulnerability check
        run: ./scripts/check-vulnerabilities.sh

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Restore go build cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-unit-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-unit-${{ runner.os }}-${{ hashFiles('go.sum') }}-

      - name: Build
        run: go build ./...

      - name: Build test helpers
        run: |
          testbin=$(mktemp -d)
          scripts/test-bins.sh "$testbin" >> "$GITHUB_ENV"

      - name: Unit tests
        run: go test -race -tags test -timeout 120s ./...

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Restore go build cache
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-${{ hashFiles('go.sum') }}-

      - name: Build
        run: go build ./...

      - name: Build test helpers
        run: |
          testbin=$(mktemp -d)
          scripts/test-bins.sh "$testbin" >> "$GITHUB_ENV"

      - name: Integration tests
        # Explicitly not using cached results because go's test caching cannot detect changes to our test binaries
        # We want integration tests to run cleanly every single time
        # These tests mostly wait on subprocesses, so running 16 at once instead of one per CPU (4 here) halves their time
        run: go test -race -count=1 -parallel 16 -tags integration,test -run '^TestIntegration' -timeout 180s ./...

  conformance:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/conformance/package-lock.json

      - name: Install conformance suite
        run: npm ci --prefix test/conformance

      - name: Build test helpers
        run: |
          testbin=$(mktemp -d)
          scripts/test-bins.sh "$testbin" >> "$GITHUB_ENV"

      - name: Run conformance suite
        env:
          CONFORMANCE_RESULTS: ${{ runner.temp }}/conformance
        run: go run ./test/conformancerun

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-results
          path: ${{ runner.temp }}/conformance

  ci:
    runs-on: ubuntu-latest
    needs: [lint, unit, integration]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" || "${{ needs.unit.result }}" != "success" || "${{ needs.integration.result }}" != "success" ]]; then
            exit 1
          fi
